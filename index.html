<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StripesHub Remake</title>
    <style>
        /* This changes the background color of the whole page to a dark theme */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        /* This creates the circular avatar container */
        .avatar-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #ff0000; /* Red glowing ring */
            box-shadow: 0 0 20px #ff0000;
            overflow: hidden;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
        }

        /* This styles the profile image inside the circle */
        .avatar-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* This styles the list of menu button links */
        .menu-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* This styles each individual link card button */
        .menu-card {
            background-color: #1a2238; /* Dark blue/gray button background */
            border: 1px solid #2a3754;
            border-radius: 10px;
            padding: 15px 20px;
            text-decoration: none;
            display: block;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* This makes the buttons lift up and glow when you hover over them */
        .menu-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
            border-color: #ff0000;
        }

        /* This styles the bold red titles inside each button */
        .card-title {
            color: #ff3333;
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        /* This styles the smaller helper text inside each button */
        .card-description {
            color: #b0b3b8;
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- 1. PROFILE PICTURE AREA -->
    <!-- Swap the link below with your own image URL later if you want -->
    <div class="avatar-container">
        <img class="avatar-image" src="https://placeholder.com" alt="Profile Picture">
    </div>

    <!-- 2. BUTTON LINKS AREA -->
    <div class="menu-container">

        <!-- Button 1: Frida Tools -->
        <a href="https://example.com" class="menu-card" target="_blank">
            <p class="card-title">Frida Tools</p>
            <p class="card-description">Needed For Every Mod In Here!</p>
        </a>

        <!-- Button 2: Cyber.exe Tutorial -->
        <a href="https://example.com" class="menu-card" target="_blank">
            <p class="card-title">Cyber.exe Tutorial</p>
            <p class="card-description">All Of The Downloads And Links Needed For The Cyber.exe Mod Menu</p>
        </a>

        <!-- Button 3: N5 Menu Tutorial -->
        <a href="https://example.com" class="menu-card" target="_blank">
            <p class="card-title">N5 Menu Tutorial</p>
            <p class="card-description">All The Downloads Needed For The N5 Modding Tutorial</p>
        </a>

        <!-- Button 4: Standy Mod -->
        <a href="https://example.com" class="menu-card" target="_blank">
            <p class="card-title">Standy Mod</p>
            <p class="card-description">Download the standalone setup files here</p>
        </a>

    </div>

</body>
</html>
