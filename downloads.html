<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mod Hub</title>
    <style>
        /* Base styles for the dark background */
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Profile image wrapper with the glowing ring */
        .profile-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 40px;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff1e27;
            box-shadow: 0 0 25px #ff1e27, inset 0 0 15px #ff1e27;
        }

        /* Container for the menu buttons */
        .menu-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Styled button card */
        .mod-card {
            background-color: #121620;
            border: 1px solid #1a2233;
            border-radius: 8px;
            padding: 16px;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Hover effect on the cards */
        .mod-card:hover {
            transform: translateY(-2px);
            border-color: #0044ff; /* Glow changes to blue on hover */
        }

        /* Title text inside the card - Dark Blue */
        .card-title {
            color: #0055ff;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0 0 6px 0;
        }

        /* Subtext description inside the card - Dark Slate Blue */
        .card-desc {
            color: #4b6584;
            font-size: 0.9rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Profile Area -->
    <div class="profile-container">
        <img src="profile.png" alt="Profile Avatar" class="profile-pic">
    </div>

    <!-- Links / Menu List -->
    <div class="menu-container">

        <!-- Top Card - Links Directly to Your Gofile Page -->
        <a href="https://gofile.io/d/IMZzk8" class="mod-card" target="_blank">
            <p class="card-title">Mods</p>
            <p class="card-desc">Click here to access current files.</p>
        </a>

        <!-- Second Card -->
        <a href="#" class="mod-card" onclick="return false;">
            <p class="card-title">Coming Soon</p>
            <p class="card-desc">New content will be added here shortly.</p>
        </a>

        <!-- Third Card -->
        <a href="#" class="mod-card" onclick="return false;">
            <p class="card-title">Coming Soon</p>
            <p class="card-desc">Check back later for updates.</p>
        </a>

    </div>

</body>
</html>
